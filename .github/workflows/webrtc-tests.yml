name: WebRTC Integration Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '16'

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake build-essential firefox-esr

    - name: Build WebRTCLinuxApplicationMaster
      run: |
        mkdir -p build
        cd build
        cmake ..
        make

    - name: Install Python dependencies
      run: |
        cd test/pytest/selenium_tests
        pip install -r requirements.txt

    - name: Run tests
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        AWS_DEFAULT_REGION: eu-central-1
        MOZ_HEADLESS: 1  # Enable headless mode for Firefox
      run: |
        cd test/pytest/selenium_tests
        pytest test_form.py -v

    - name: Upload test logs
      if: always()  # Upload logs even if tests fail
      uses: actions/upload-artifact@v3
      with:
        name: test-logs
        path: |
          test/pytest/selenium_tests/geckodriver.log
          build/WebRTCLinuxApplicationMaster.log
